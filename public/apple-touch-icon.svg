<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Socratic Eye - Apple Touch Icon with background -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </radialGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="180" height="180" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Eye centered in icon -->
  <g transform="translate(90, 90) scale(2.2) translate(-32, -32)">
    <!-- Eye outline -->
    <ellipse cx="32" cy="32" rx="28" ry="16" fill="white" stroke="#8b5cf6" stroke-width="2"/>
    
    <!-- Iris -->
    <circle cx="32" cy="32" r="14" fill="url(#irisGrad)"/>
    
    <!-- Graph network inside iris -->
    <line x1="32" y1="20" x2="32" y2="26" stroke="white" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="32" y1="38" x2="32" y2="44" stroke="white" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="20" y1="32" x2="26" y2="32" stroke="#22c55e" stroke-width="1.5"/>
    <line x1="38" y1="32" x2="44" y2="32" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="24" y1="24" x2="28" y2="28" stroke="#3b82f6" stroke-width="1"/>
    <line x1="40" y1="24" x2="36" y2="28" stroke="#3b82f6" stroke-width="1"/>
    <line x1="24" y1="40" x2="28" y2="36" stroke="#22c55e" stroke-width="1"/>
    <line x1="40" y1="40" x2="36" y2="36" stroke="#ef4444" stroke-width="1"/>
    
    <!-- Mini nodes in iris -->
    <circle cx="32" cy="20" r="2" fill="white" fill-opacity="0.8"/>
    <circle cx="32" cy="44" r="2" fill="white" fill-opacity="0.8"/>
    <circle cx="20" cy="32" r="2.5" fill="#22c55e"/>
    <circle cx="44" cy="32" r="2.5" fill="#ef4444"/>
    <circle cx="24" cy="24" r="2" fill="#3b82f6"/>
    <circle cx="40" cy="24" r="2" fill="#3b82f6"/>
    <circle cx="24" cy="40" r="2" fill="#22c55e"/>
    <circle cx="40" cy="40" r="2" fill="#ef4444"/>
    
    <!-- Pupil -->
    <circle cx="32" cy="32" r="6" fill="#1f2937"/>
    <circle cx="32" cy="32" r="3" fill="white"/>
    
    <!-- Eye highlight -->
    <circle cx="36" cy="28" r="2" fill="white" fill-opacity="0.6"/>
  </g>
</svg>