<svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Socratic Eye - Favicon optimized -->
  <defs>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </radialGradient>
  </defs>
  
  <!-- Eye outline -->
  <ellipse cx="32" cy="32" rx="28" ry="16" fill="white" stroke="#8b5cf6" stroke-width="3"/>
  
  <!-- Iris -->
  <circle cx="32" cy="32" r="14" fill="url(#irisGrad)"/>
  
  <!-- Simplified network in iris -->
  <line x1="20" y1="32" x2="26" y2="32" stroke="#22c55e" stroke-width="2"/>
  <line x1="38" y1="32" x2="44" y2="32" stroke="#ef4444" stroke-width="2"/>
  <line x1="32" y1="20" x2="32" y2="26" stroke="white" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="32" y1="38" x2="32" y2="44" stroke="white" stroke-width="1.5" stroke-opacity="0.7"/>
  
  <!-- Mini nodes -->
  <circle cx="20" cy="32" r="3" fill="#22c55e"/>
  <circle cx="44" cy="32" r="3" fill="#ef4444"/>
  
  <!-- Pupil -->
  <circle cx="32" cy="32" r="6" fill="#1f2937"/>
  <circle cx="32" cy="32" r="3" fill="white"/>
  
  <!-- Highlight -->
  <circle cx="36" cy="28" r="2.5" fill="white" fill-opacity="0.7"/>
</svg>