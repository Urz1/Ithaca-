name: Load test

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      base_url:
        description: Approved staging base URL
        required: true
        type: string
      scenario:
        description: k6 scenario name
        required: false
        default: public-pages
        type: choice
        options:
          - public-pages
          - health-and-public
          - authenticated-api

jobs:
  k6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      - run: npm run test:load:budgets
      - name: Run selected k6 scenario
        env:
          BASE_URL: ${{ inputs.base_url || secrets.STAGING_BASE_URL }}
          LOAD_SCENARIO: ${{ inputs.scenario || 'authenticated-api' }}
          SESSION_COOKIE: ${{ secrets.LOAD_TEST_SESSION_COOKIE }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "No BASE_URL configured; skipping k6 run."
            exit 0
          fi
          npm run test:load
