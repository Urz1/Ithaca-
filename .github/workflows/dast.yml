name: DAST

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Approved staging URL to scan
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url }}
          cmd_options: -a
