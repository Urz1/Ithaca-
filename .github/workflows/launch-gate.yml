name: Launch gate

on:
  workflow_dispatch:
    inputs:
      high_vulnerabilities:
        description: Recorded high-severity dependency findings
        required: false
        default: "0"
        type: string

jobs:
  readiness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ithaca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ithaca_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run prisma:migrate:deploy
      - name: Evaluate launch readiness
        env:
          LAUNCH_CHECK_HIGH_VULNS: ${{ inputs.high_vulnerabilities }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ithaca_test
          BETTER_AUTH_SECRET: launch-gate-launch-gate-launch-gate
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          CRON_SECRET: launch-gate-cron-secret-for-integration-tests
          RUN_INTEGRATION_TESTS: "1"
        run: npm run launch:check
